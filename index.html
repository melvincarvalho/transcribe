<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcribe — Live Speech to Text</title>
  <meta name="description" content="Real-time speech-to-text powered by Parakeet TDT 0.6B v3 with WebGPU. Runs entirely in your browser.">
  <meta property="og:title" content="Transcribe — Live Speech to Text">
  <meta property="og:description" content="Real-time speech-to-text powered by AI. Runs entirely in your browser with WebGPU acceleration. No server, no data leaves your device.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://melvincarvalho.github.io/transcribe/">
  <meta property="og:image" content="https://melvincarvalho.github.io/transcribe/og.png">

  <meta name="twitter:image" content="https://melvincarvalho.github.io/transcribe/og.png">
  <meta name="twitter:title" content="Transcribe — Live Speech to Text">
  <meta name="twitter:description" content="Real-time speech-to-text powered by AI. Runs entirely in your browser. No server, no data leaves your device.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #070714; --bg-card: #0e0e24; --border: #1e1e3a;
      --text: #e4e4f0; --text-dim: #7878a0; --accent: #00d4ff;
      --accent2: #7c3aed; --green: #10b981; --red: #ef4444;
      --yellow: #fbbf24; --cyan: #22d3ee;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 25% 0%, rgba(0,212,255,.06) 0%, transparent 60%),
        radial-gradient(ellipse at 75% 100%, rgba(124,58,237,.06) 0%, transparent 60%);
    }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header { border-bottom: 1px solid var(--border); padding: 32px 0 24px; }
    header h1 {
      font-size: 2rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--text-dim); margin-top: 6px; font-size: 0.92rem; }

    /* Cards */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; margin-top: 28px;
    }
    .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 10px; border: none;
      font: 600 0.95rem 'Inter', sans-serif; cursor: pointer;
      transition: all .2s; color: #fff;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-load {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 4px 20px rgba(0,212,255,.2);
    }
    .btn-load:hover { box-shadow: 0 6px 28px rgba(0,212,255,.3); }
    .btn-rec {
      background: linear-gradient(135deg, var(--green), #059669);
      box-shadow: 0 4px 20px rgba(16,185,129,.2);
    }
    .btn-stop {
      background: linear-gradient(135deg, var(--red), #dc2626);
      box-shadow: 0 4px 20px rgba(239,68,68,.2);
    }
    .btn-upload {
      background: linear-gradient(135deg, var(--accent2), #6d28d9);
      box-shadow: 0 4px 20px rgba(124,58,237,.2);
    }
    .btn-sm {
      padding: 8px 16px; font-size: 0.82rem; border-radius: 8px;
      background: #1a1a38; border: 1px solid var(--border);
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Mic button */
    .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }
    .mic-btn {
      width: 88px; height: 88px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .3s; position: relative;
    }
    .mic-btn.idle {
      background: linear-gradient(135deg, var(--green), #059669);
      box-shadow: 0 0 0 0 rgba(16,185,129,.4);
    }
    .mic-btn.idle:hover { box-shadow: 0 0 30px rgba(16,185,129,.3); }
    .mic-btn.active {
      background: linear-gradient(135deg, var(--red), #dc2626);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
      50% { box-shadow: 0 0 0 18px rgba(239,68,68,0); }
    }
    .mic-btn svg { width: 36px; height: 36px; fill: #fff; }

    /* Waveform */
    .waveform {
      width: 100%; height: 56px; border-radius: 8px;
      background: rgba(0,0,0,.25); display: block;
    }

    /* Progress */
    .progress-list { display: flex; flex-direction: column; gap: 10px; }
    .progress-item { font-size: 0.82rem; }
    .progress-item .label { color: var(--text-dim); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 2px; transition: width .3s;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    /* Transcription */
    .transcript-box {
      min-height: 180px; max-height: 400px; overflow-y: auto;
      font-size: 1.12rem; line-height: 1.9; padding: 4px 0;
    }
    .fixed { color: var(--yellow); }
    .active { color: var(--cyan); opacity: .85; }
    .placeholder { color: var(--text-dim); font-style: italic; }
    .cursor-blink::after {
      content: '|'; animation: blink .8s step-end infinite; margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Legend */
    .legend {
      display: flex; gap: 20px; font-size: 0.82rem; color: var(--text-dim);
      border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px;
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend .dot { width: 12px; height: 12px; border-radius: 3px; }

    /* Metrics */
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .metric {
      background: rgba(0,0,0,.2); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
    }
    .metric .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
    .metric .value { font-size: 1.5rem; font-weight: 700; font-family: 'Inter', monospace; margin-top: 2px; }
    .metric .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

    /* Status badge */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
    }
    .badge-ready { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: var(--green); }
    .badge-loading { background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.2); color: var(--accent); }
    .badge-error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: var(--red); }

    /* Recording indicator */
    .rec-dot { width: 10px; height: 10px; background: var(--red); border-radius: 50%; animation: pulse-dot 1s ease-in-out infinite; }
    @keyframes pulse-dot { 50% { opacity: .4; } }

    /* Audio level */
    .level-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0; }
    .level-fill {
      height: 100%; border-radius: 3px; transition: width 75ms;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    }

    /* Controls row */
    .controls-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    /* Footer */
    footer { border-top: 1px solid var(--border); margin-top: 48px; padding: 20px 0; text-align: center; font-size: 0.82rem; color: var(--text-dim); }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* File input */
    .file-label {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    }
    .file-label input { display: none; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Responsive */
    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .btn { padding: 10px 18px; font-size: .88rem; }
    }

    /* Fade in */
    .fade-in { animation: fadeIn .4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.25.4';
import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.25.4/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

// ── Constants ──────────────────────────────────────────────
const SAMPLE_RATE = 16000;
const MAX_WINDOW = 15.0;
const SENTENCE_BUFFER = 2.0;
const UPDATE_MS = 250;

// ── Worker (blob URL, module type, dynamic import of parakeet.js) ──
function createWorker() {
  const code = `
let model = null, loading = false;

async function loadModel(version, opts) {
  if (loading || model) return;
  loading = true;
  try {
    self.postMessage({ status: 'loading', message: 'Importing parakeet.js...' });
    const { fromHub } = await import('https://esm.sh/parakeet.js@1.1.2');
    const backend = opts.device === 'webgpu' ? 'webgpu-hybrid' : 'wasm';
    const quant = backend === 'wasm'
      ? { encoderQuant: 'int8', decoderQuant: 'int8', preprocessor: 'nemo128' }
      : { encoderQuant: 'fp32', decoderQuant: 'int8', preprocessor: 'nemo128' };
    self.postMessage({ status: 'loading', message: 'Downloading model (~2.5 GB)...' });
    const initiated = new Set();
    model = await fromHub(version, {
      backend, ...quant,
      progress: (p) => {
        const pct = p.total > 0 ? Math.round((p.loaded / p.total) * 100) : 0;
        if (!initiated.has(p.file)) {
          initiated.add(p.file);
          self.postMessage({ status: 'initiate', file: p.file, progress: 0, total: p.total });
        }
        self.postMessage({ status: 'progress', file: p.file, progress: pct, total: p.total, loaded: p.loaded });
        if (p.loaded >= p.total) self.postMessage({ status: 'done', file: p.file });
      }
    });
    self.postMessage({ status: 'loading', message: 'Warming up...' });
    await model.transcribe(new Float32Array(16000), 16000);
    self.postMessage({ status: 'ready', device: backend });
  } catch (e) {
    self.postMessage({ status: 'error', message: e.message });
  } finally { loading = false; }
}

function groupSentences(words) {
  if (!words || !words.length) return [];
  const out = []; let cur = [], start = words[0].start_time || 0;
  for (let i = 0; i < words.length; i++) {
    cur.push(words[i].text);
    if (/[.!?]$/.test(words[i].text) || i === words.length - 1) {
      out.push({ text: cur.join(' ').trim(), start, end: words[i].end_time || 0 });
      cur = [];
      if (i + 1 < words.length) start = words[i + 1].start_time || 0;
    }
  }
  return out;
}

async function transcribe(audio) {
  if (!model) throw new Error('Model not loaded');
  const t0 = performance.now();
  const r = await model.transcribe(audio, 16000, { returnTimestamps: true, returnConfidences: true, temperature: 1.0 });
  const lat = (performance.now() - t0) / 1000;
  const dur = audio.length / 16000;
  self.postMessage({
    status: 'transcription',
    result: {
      text: r.utterance_text || '',
      sentences: groupSentences(r.words || []),
      metadata: { latency: lat, audioDuration: dur, rtf: dur / lat }
    }
  });
}

self.onmessage = async (e) => {
  try {
    if (e.data.type === 'load') await loadModel(e.data.data.modelVersion, e.data.data.options);
    else if (e.data.type === 'transcribe') await transcribe(e.data.data.audio);
  } catch (err) { self.postMessage({ status: 'error', message: err.message }); }
};
`;
  const blob = new Blob([code], { type: 'text/javascript' });
  return new Worker(URL.createObjectURL(blob), { type: 'module' });
}

// ── Audio Recorder ─────────────────────────────────────────
class AudioRecorder {
  constructor(onChunk) {
    this.onChunk = onChunk;
    this.ctx = null; this.stream = null; this.processor = null;
    this.source = null; this.analyser = null; this.recording = false;
    this.chunks = [];
  }
  resample(data, from, to) {
    if (from === to) return new Float32Array(data);
    const ratio = from / to, len = Math.round(data.length / ratio), out = new Float32Array(len);
    for (let i = 0; i < len; i++) {
      const si = i * ratio, lo = Math.floor(si), hi = Math.min(lo + 1, data.length - 1), t = si - lo;
      out[i] = data[lo] * (1 - t) + data[hi] * t;
    }
    return out;
  }
  async start() {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Microphone access requires HTTPS or localhost. Please use ./serve.sh or access via localhost.');
    }
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    this.ctx = new AudioContext();
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.source = this.ctx.createMediaStreamSource(this.stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.processor = this.ctx.createScriptProcessor(4096, 1, 1);
    const nativeRate = this.ctx.sampleRate;
    this.processor.onaudioprocess = (e) => {
      if (!this.recording) return;
      const raw = e.inputBuffer.getChannelData(0);
      const chunk = this.resample(raw, nativeRate, SAMPLE_RATE);
      this.chunks.push(chunk);
      this.onChunk(chunk);
    };
    this.source.connect(this.analyser);
    this.analyser.connect(this.processor);
    this.processor.connect(this.ctx.destination);
    this.recording = true;
  }
  stop() {
    this.recording = false;
    this.processor?.disconnect();
    this.source?.disconnect();
    this.analyser?.disconnect();
    this.stream?.getTracks().forEach(t => t.stop());
    let len = 0;
    for (const c of this.chunks) len += c.length;
    const out = new Float32Array(len);
    let off = 0;
    for (const c of this.chunks) { out.set(c, off); off += c.length; }
    this.chunks = [];
    if (this.ctx?.state !== 'closed') this.ctx?.close();
    return out;
  }
}

// ── Audio Buffer ───────────────────────────────────────────
class AudioBuffer16k {
  constructor() { this.buf = new Float32Array(0); }
  append(chunk) {
    const n = new Float32Array(this.buf.length + chunk.length);
    n.set(this.buf); n.set(chunk, this.buf.length); this.buf = n;
  }
  get data() { return this.buf; }
  get duration() { return this.buf.length / SAMPLE_RATE; }
  reset() { this.buf = new Float32Array(0); }
}

// ── Progressive Streaming Handler ──────────────────────────
class ProgressiveStreamer {
  constructor(transcribeFn) {
    this.transcribe = transcribeFn;
    this.reset();
  }
  reset() { this.fixedSentences = []; this.fixedEndTime = 0; this.lastLen = 0; }
  async update(audio) {
    const len = audio.length;
    if (len < SAMPLE_RATE * 0.5 || len === this.lastLen)
      return { fixed: this.fixedSentences.join(' '), active: '', ts: len / SAMPLE_RATE };
    this.lastLen = len;
    const wStart = Math.floor(this.fixedEndTime * SAMPLE_RATE);
    const window = audio.slice(wStart);
    const wDur = window.length / SAMPLE_RATE;
    let result = await this.transcribe(window);
    if (wDur >= MAX_WINDOW && result.sentences?.length > 1) {
      const cutoff = wDur - SENTENCE_BUFFER;
      const toFix = [];
      let newEnd = this.fixedEndTime;
      for (const s of result.sentences) {
        if (s.end < cutoff) { toFix.push(s.text.trim()); newEnd = this.fixedEndTime + s.end; }
        else break;
      }
      if (toFix.length) {
        this.fixedSentences.push(...toFix);
        this.fixedEndTime = newEnd;
        const w2 = audio.slice(Math.floor(this.fixedEndTime * SAMPLE_RATE));
        result = await this.transcribe(w2);
      }
    }
    return {
      fixed: this.fixedSentences.join(' '),
      active: result.text?.trim() || '',
      ts: len / SAMPLE_RATE,
      windowState: wDur >= MAX_WINDOW ? 'sliding' : 'growing'
    };
  }
  async finalize(audio) {
    const r = await this.update(audio);
    return [r.fixed, r.active].filter(Boolean).join(' ');
  }
}

// ── Helpers ────────────────────────────────────────────────
function fmtTime(s) {
  if (s == null) return '--';
  const m = Math.floor(s / 60), sec = (s % 60).toFixed(1);
  return m > 0 ? `${m}:${sec.padStart(4, '0')}` : `${sec}s`;
}
function fmtBytes(b) {
  if (b > 1e9) return (b / 1e9).toFixed(1) + ' GB';
  if (b > 1e6) return (b / 1e6).toFixed(1) + ' MB';
  if (b > 1e3) return (b / 1e3).toFixed(0) + ' KB';
  return b + ' B';
}

// ── Waveform Canvas ────────────────────────────────────────
function Waveform({ analyser, active }) {
  const ref = useRef(null);
  const raf = useRef(null);
  useEffect(() => {
    if (!analyser || !active || !ref.current) return;
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    const data = new Uint8Array(analyser.frequencyBinCount);
    function draw() {
      raf.current = requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(data);
      ctx.fillStyle = 'rgba(7,7,20,0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      grad.addColorStop(0, '#00d4ff');
      grad.addColorStop(0.5, '#7c3aed');
      grad.addColorStop(1, '#00d4ff');
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 6;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const step = canvas.width / data.length;
      for (let i = 0; i < data.length; i++) {
        const y = (data[i] / 128) * canvas.height / 2;
        i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * step, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    draw();
    return () => cancelAnimationFrame(raf.current);
  }, [analyser, active]);
  return html`<canvas ref=${ref} class="waveform" width="800" height="56"></canvas>`;
}

// ── Progress Bar ───────────────────────────────────────────
function ProgressItem({ file, progress, total }) {
  const name = file?.split('/').pop() || file;
  return html`
    <div class="progress-item">
      <div class="label">${name} ${total ? `(${fmtBytes(total)})` : ''}</div>
      <div class="progress-bar"><div class="progress-fill" style=${{ width: progress + '%' }}></div></div>
    </div>`;
}

// ── Metric Card ────────────────────────────────────────────
function Metric({ label, value, unit, color, sub }) {
  return html`
    <div class="metric">
      <div class="label">${label}</div>
      <div class="value" style=${{ color: color || 'var(--text)' }}>
        ${value != null ? value : '--'}
        ${unit && value != null ? html`<span style="font-size:.6em;color:var(--text-dim);margin-left:4px">${unit}</span>` : ''}
      </div>
      ${sub && html`<div class="sub">${sub}</div>`}
    </div>`;
}

// ── App ────────────────────────────────────────────────────
function App() {
  const [status, setStatus] = useState('idle');
  const [msg, setMsg] = useState('');
  const [recording, setRecording] = useState(false);
  const [fixed, setFixed] = useState('');
  const [active, setActive] = useState('');
  const [ts, setTs] = useState(0);
  const [progress, setProgress] = useState([]);
  const [level, setLevel] = useState(0);
  const [latency, setLatency] = useState(null);
  const [rtf, setRtf] = useState(null);
  const [winState, setWinState] = useState(null);
  const [device, setDevice] = useState(null);
  const [processing, setProcessing] = useState(false);

  const workerRef = useRef(null);
  const recRef = useRef(null);
  const bufRef = useRef(null);
  const streamerRef = useRef(null);
  const intervalRef = useRef(null);
  const transcriptRef = useRef(null);

  // Auto-scroll transcript
  useEffect(() => {
    if (transcriptRef.current) transcriptRef.current.scrollTop = transcriptRef.current.scrollHeight;
  }, [fixed, active]);

  // Init worker
  useEffect(() => {
    const w = createWorker();
    workerRef.current = w;
    w.onmessage = (e) => {
      const d = e.data;
      if (d.status === 'loading') { setStatus('loading'); setMsg(d.message); }
      else if (d.status === 'ready') { setStatus('ready'); setDevice(d.device); setProgress([]); }
      else if (d.status === 'error') { setStatus('error'); setMsg(d.message); }
      else if (d.status === 'initiate') {
        setProgress(p => [...p, { file: d.file, progress: 0, total: d.total }]);
      } else if (d.status === 'progress') {
        setProgress(p => p.map(x => x.file === d.file ? { ...x, progress: d.progress, total: d.total } : x));
      } else if (d.status === 'done') {
        setProgress(p => p.map(x => x.file === d.file ? { ...x, progress: 100 } : x));
      } else if (d.status === 'transcription' && d.result?.metadata) {
        setLatency(d.result.metadata.latency);
        setRtf(d.result.metadata.rtf);
      }
    };
    return () => w.terminate();
  }, []);

  // Model proxy: sends audio to worker, returns promise
  const transcribeViaWorker = useCallback((audio) => new Promise((resolve, reject) => {
    const handler = (e) => {
      if (e.data.status === 'transcription') {
        workerRef.current.removeEventListener('message', handler);
        resolve(e.data.result);
      } else if (e.data.status === 'error') {
        workerRef.current.removeEventListener('message', handler);
        reject(new Error(e.data.message));
      }
    };
    workerRef.current.addEventListener('message', handler);
    workerRef.current.postMessage({ type: 'transcribe', data: { audio } });
  }), []);

  const loadModel = () => {
    if (status === 'loading' || status === 'ready') return;
    setStatus('loading'); setMsg('Initializing...');
    workerRef.current.postMessage({
      type: 'load',
      data: { modelVersion: 'parakeet-tdt-0.6b-v3', options: { device: 'webgpu' } }
    });
  };

  const startRec = async () => {
    if (status !== 'ready') return;
    setFixed(''); setActive(''); setTs(0); setLatency(null); setRtf(null);
    bufRef.current = new AudioBuffer16k();
    streamerRef.current = new ProgressiveStreamer(transcribeViaWorker);
    const rec = new AudioRecorder((chunk) => {
      const mx = Math.max(...Array.from(chunk).map(Math.abs));
      setLevel(Math.min(100, mx * 300));
      bufRef.current.append(chunk);
    });
    recRef.current = rec;
    try {
      await rec.start();
    } catch (e) {
      setActive('Error: ' + e.message);
      return;
    }
    setRecording(true);

    let busy = false;
    let silentMs = 0;
    const SILENCE_TIMEOUT = 3000;
    intervalRef.current = setInterval(async () => {
      if (!recRef.current?.recording) { clearInterval(intervalRef.current); return; }
      const buf = bufRef.current.data;
      setTs(buf.length / SAMPLE_RATE);
      if (busy || buf.length < SAMPLE_RATE) return;
      // Simple VAD
      const tail = buf.slice(-Math.min(32000, buf.length));
      let mx = 0; for (let i = 0; i < tail.length; i++) { const a = Math.abs(tail[i]); if (a > mx) mx = a; }
      if (mx < 0.01) {
        silentMs += UPDATE_MS;
        if (silentMs >= SILENCE_TIMEOUT && buf.length > SAMPLE_RATE) { stopRec(); return; }
        return;
      }
      silentMs = 0;
      busy = true;
      try {
        const r = await streamerRef.current.update(buf);
        setFixed(r.fixed); setActive(r.active); setWinState(r.windowState || 'growing');
      } catch (e) { console.error(e); }
      busy = false;
    }, UPDATE_MS);
  };

  const stopRec = async () => {
    if (!recording) return;
    clearInterval(intervalRef.current);
    setRecording(false);
    if (recRef.current) {
      recRef.current.stop();
      if (bufRef.current?.data.length > 0 && streamerRef.current) {
        try {
          const final = await streamerRef.current.finalize(bufRef.current.data);
          setFixed(final); setActive('');
        } catch (e) { console.error(e); }
      }
    }
    setWinState(null); setLevel(0);
  };

  const handleFile = async (file) => {
    if (!file) return;
    setFixed(''); setActive('Loading...'); setTs(0); setProcessing(true);
    setLatency(null); setRtf(null);
    try {
      const actx = new AudioContext({ sampleRate: SAMPLE_RATE });
      const ab = await file.arrayBuffer();
      const decoded = await actx.decodeAudioData(ab);
      const audio = decoded.getChannelData(0);
      setActive('Processing...');
      const streamer = new ProgressiveStreamer(transcribeViaWorker);
      const totalDur = audio.length / SAMPLE_RATE;
      let processed = 0;
      const t0 = performance.now();
      while (processed < totalDur) {
        const wEnd = Math.min(processed + MAX_WINDOW, totalDur);
        const wDur = wEnd - processed;
        const window = audio.slice(Math.floor(processed * SAMPLE_RATE), Math.floor(wEnd * SAMPLE_RATE));
        const r = await transcribeViaWorker(window);
        if (wDur >= MAX_WINDOW && r.sentences?.length > 1) {
          const cutoff = wDur - SENTENCE_BUFFER;
          const toFix = r.sentences.filter(s => s.end < cutoff);
          if (toFix.length) {
            streamer.fixedSentences.push(...toFix.map(s => s.text.trim()));
            processed += toFix[toFix.length - 1].end;
          } else {
            streamer.fixedSentences.push(r.text?.trim() || '');
            processed += wDur / 2;
          }
        } else {
          streamer.fixedSentences.push(r.text?.trim() || '');
          processed = wEnd;
        }
        setFixed(streamer.fixedSentences.join(' ')); setActive('');
        setTs(Math.min(processed, totalDur));
        const elapsed = (performance.now() - t0) / 1000;
        setLatency(elapsed); setRtf(processed / elapsed);
        setWinState('sliding');
      }
    } catch (e) { setActive('Error: ' + e.message); }
    setProcessing(false); setWinState(null);
  };

  const clearCache = async () => {
    if (!confirm('Clear cached model files (~2.5 GB)?')) return;
    const dbs = await indexedDB.databases();
    for (const db of dbs) indexedDB.deleteDatabase(db.name);
    location.reload();
  };

  const analyser = recRef.current?.analyser;
  const latColor = latency == null ? 'var(--text-dim)' : latency < 0.5 ? 'var(--green)' : latency < 1 ? 'var(--yellow)' : 'var(--red)';
  const rtfColor = rtf == null ? 'var(--text-dim)' : rtf > 5 ? 'var(--green)' : rtf > 1 ? 'var(--yellow)' : 'var(--red)';

  return html`
    <header>
      <div class="container">
        <h1>Transcribe</h1>
        <p>Real-time speech to text — runs entirely in your browser</p>
      </div>
    </header>

    <main class="container">
      <!-- Controls -->
      <div class="card">
        ${status === 'idle' && html`
          <div style="text-align:center;padding:16px 0">
            <p style="color:var(--text-dim);margin-bottom:16px;font-size:.92rem">
              Load the Parakeet TDT 0.6B v3 model to get started.<br/>
              <span style="font-size:.82rem">First load downloads ~2.5 GB (cached for future visits).</span>
            </p>
            <div class="controls-row" style="justify-content:center">
              <button class="btn btn-load" onClick=${loadModel}>Load Model</button>
              <button class="btn btn-sm" onClick=${clearCache}>Clear Cache</button>
            </div>
          </div>
        `}

        ${status === 'loading' && html`
          <div class="fade-in">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
              <div class="spinner"></div>
              <span style="color:var(--text-dim);font-size:.92rem">${msg}</span>
            </div>
            ${progress.length > 0 && html`
              <div class="progress-list">
                ${progress.map(p => html`<${ProgressItem} ...${p} />`)}
              </div>
            `}
          </div>
        `}

        ${status === 'error' && html`
          <div class="fade-in" style="text-align:center;padding:16px 0">
            <div class="badge badge-error" style="margin-bottom:12px">Error: ${msg}</div>
            <button class="btn btn-load" onClick=${() => { setStatus('idle'); }}>Retry</button>
          </div>
        `}

        ${status === 'ready' && html`
          <div class="fade-in">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
              <div class="badge badge-ready">Model Ready</div>
              <div class="controls-row">
                ${!recording && !processing && html`
                  <label class="btn btn-upload file-label">
                    Upload Audio
                    <input type="file" accept="audio/*" onChange=${(e) => handleFile(e.target.files?.[0])} />
                  </label>
                `}
                <button class="btn btn-sm" onClick=${clearCache}>Clear Cache</button>
              </div>
            </div>

            <!-- Mic button -->
            ${!processing && html`
              <div class="mic-wrap">
                <button class=${'mic-btn ' + (recording ? 'active' : 'idle')}
                  onClick=${recording ? stopRec : startRec}
                  title=${recording ? 'Stop recording' : 'Start recording'}>
                  <svg viewBox="0 0 24 24">
                    ${recording
                      ? html`<rect x="6" y="6" width="12" height="12" rx="2"/>`
                      : html`<path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4zm7 10a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11z"/>`
                    }
                  </svg>
                </button>
                <span style="font-size:.82rem;color:var(--text-dim)">
                  ${recording ? 'Tap to stop' : 'Tap to speak'}
                </span>
              </div>
            `}

            ${processing && html`
              <div style="text-align:center;padding:16px 0;color:var(--text-dim)">
                <div class="spinner" style="margin:0 auto 12px"></div>
                Processing audio file...
              </div>
            `}

            <!-- Audio level + waveform -->
            ${recording && html`
              <div>
                <div class="level-bar"><div class="level-fill" style=${{ width: level + '%' }}></div></div>
                <${Waveform} analyser=${analyser} active=${recording} />
              </div>
            `}
          </div>
        `}
      </div>

      <!-- Transcription -->
      ${(fixed || active || recording || processing) && html`
        <div class="card fade-in">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <h2 style="margin:0">Live Transcription</h2>
            <div style="display:flex;align-items:center;gap:12px">
              ${recording && html`
                <div style="display:flex;align-items:center;gap:6px">
                  <div class="rec-dot"></div>
                  <span style="font-size:.82rem;color:var(--text-dim)">Recording</span>
                </div>
              `}
              ${ts > 0 && html`
                <span style="font-size:.82rem;color:var(--text-dim);font-variant-numeric:tabular-nums">${fmtTime(ts)}</span>
              `}
            </div>
          </div>

          <div class="transcript-box" ref=${transcriptRef}>
            ${!fixed && !active && recording && html`<span class="placeholder">Listening...</span>`}
            ${!fixed && !active && !recording && !processing && html`<span class="placeholder">Transcription will appear here</span>`}
            ${fixed && html`<span class="fixed">${fixed} </span>`}
            ${active && html`<span class=${'active' + (recording ? ' cursor-blink' : '')}>${active}</span>`}
          </div>

          <div class="legend">
            <span><div class="dot" style="background:var(--yellow)"></div> Confirmed</span>
            <span><div class="dot" style="background:var(--cyan)"></div> In progress</span>
          </div>
        </div>
      `}

      <!-- Metrics -->
      ${(latency != null || recording) && html`
        <div class="card fade-in">
          <h2>Performance</h2>
          <div class="metrics-grid">
            <${Metric} label=${processing ? 'Processing' : 'Latency'}
              value=${latency != null ? (latency < 60 ? latency.toFixed(2) : fmtTime(latency)) : null}
              unit=${latency != null && latency < 60 ? 's' : ''} color=${processing ? 'var(--accent)' : latColor} />
            <${Metric} label="Speed" value=${rtf != null ? rtf.toFixed(1) : null} unit="x realtime" color=${rtfColor}
              sub=${rtf != null ? (rtf > 1 ? 'Faster than realtime' : 'Slower than realtime') : ''} />
            <${Metric} label="Window" value=${winState || 'idle'}
              sub=${winState === 'growing' ? '0–15s context' : winState === 'sliding' ? 'Sentence-aware' : ''} />
          </div>
          ${device && html`
            <div style="margin-top:12px;font-size:.78rem;color:var(--text-dim);text-align:center">
              ${device === 'webgpu-hybrid' ? 'WebGPU encoder + WASM decoder' : device}
              — Parakeet TDT 0.6B v3 — 16 kHz
            </div>
          `}
        </div>
      `}
    </main>

    <footer>
      <div class="container">
        <a href="https://github.com/melvincarvalho/transcribe" target="_blank" rel="noopener">Source</a>
        — AGPL-3.0
      </div>
    </footer>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
